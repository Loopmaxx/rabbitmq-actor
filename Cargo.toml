[package]
name = "rabbitmq-actor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Actor-based RabbitMQ client on top of lapin with quorum queue support, automatic reconnect and JSON configuration"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rabbitmq", "amqp", "quorum-queue", "actor", "lapin"]
categories = ["network-programming", "asynchronous"]
exclude = ["docs/", "README.de.md"]
# repository = "https://github.com/<user>/<repo>"

[features]
default = ["rustls"]
## TLS (`amqps://`) with rustls, the `ring` crypto provider and the platform's
## certificate store. Needs no cmake or Go toolchain.
rustls = ["lapin/rustls--ring", "lapin/rustls-platform-verifier"]
## TLS with rustls and the `aws-lc-rs` crypto provider (lapin's default, FIPS capable;
## builds C code with cmake on some targets).
rustls-aws-lc = ["lapin/rustls"]
## TLS with the operating system's library (OpenSSL, SChannel, Secure Transport).
native-tls = ["lapin/native-tls"]

[dependencies]
lapin = { version = "4.12.3", default-features = false, features = ["default-runtime"] }
tokio = { version = "1.53.1", features = ["sync", "macros", "rt", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
tracing = "0.1.44"
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
